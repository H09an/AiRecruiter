name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true

      - name: Restore dependencies
        run: dotnet restore AiRecruiter.slnx

      - name: Build
        run: dotnet build AiRecruiter.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Format check
        run: dotnet format AiRecruiter.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test AiRecruiter.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/results.trx'
