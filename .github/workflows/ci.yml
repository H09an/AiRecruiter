name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          # No packages.lock.json here (CPM keeps versions in Directory.Packages.props),
          # so the cache key is built from the files that define dependencies.
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore dependencies
        run: dotnet restore AiRecruiter.slnx

      - name: Build
        run: dotnet build AiRecruiter.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Format check
        run: dotnet format AiRecruiter.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test AiRecruiter.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/results.trx'
